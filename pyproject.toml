[project]
name = "drumsmith"
version = "0.1.0"
description = "Compile a short text description of a song into a humanised drum backing track."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joe Heffer" }]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Typing :: Typed",
]
dependencies = ["mido>=1.3"]

[project.urls]
Repository = "https://github.com/Joe-Heffer/drumsmith"
Issues = "https://github.com/Joe-Heffer/drumsmith/issues"

[project.scripts]
drumsmith = "drumsmith.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["mido", "mido.*"]
ignore_missing_imports = true
