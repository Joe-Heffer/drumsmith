[project]
name = "drumsmith"
version = "0.1.0"
description = "Compile a short text description of a song into a humanised drum backing track."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["mido>=1.3"]

[project.scripts]
drumsmith = "drumsmith.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
